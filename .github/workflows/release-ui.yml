name: Release UI

on:
  push:
    tags:
      - 'ui-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@8.15.9
      - run: pnpm install --frozen-lockfile
      - name: Install browser for page-control tests
        run: pnpm exec puppeteer browsers install chrome
      - name: Run matching, configuration and packaging tests
        run: node --test packages/utils/*.test.mjs packages/geek-auto-start-chat-with-boss/*.test.mjs packages/ui/src/renderer/src/features/CompanyTags/*.test.mjs packages/ui/src/renderer/src/features/JobFilterSettingsPreview/*.test.mjs packages/ui/src/renderer/src/features/JobModelInputPreview/*.test.mjs packages/ui/scripts/native-database.test.cjs

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
            app-directory: mac
          - os: macos-15
            platform: macos
            arch: arm64
            app-directory: mac-arm64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@8.15.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/ui typecheck
      - name: Build installer
        run: pnpm --dir packages/ui build:make-dist-for-current-platform
      - name: Check packaged Windows database
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          & ./packages/ui/dist/win-unpacked/geekgeekrun-pro.exe ./packages/ui/scripts/packaged-database-smoke.cjs ./packages/ui/dist/win-unpacked/resources/app.asar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check packaged Mac database
        if: runner.os == 'macOS'
        run: ELECTRON_RUN_AS_NODE=1 'packages/ui/dist/${{ matrix.app-directory }}/GeekGeekRun Pro.app/Contents/MacOS/GeekGeekRun Pro' packages/ui/scripts/packaged-database-smoke.cjs 'packages/ui/dist/${{ matrix.app-directory }}/GeekGeekRun Pro.app/Contents/Resources/app.asar'
      - name: Check packaged Linux database
        if: runner.os == 'Linux'
        run: ELECTRON_RUN_AS_NODE=1 packages/ui/dist/linux-unpacked/geekgeekrun-pro packages/ui/scripts/packaged-database-smoke.cjs packages/ui/dist/linux-unpacked/resources/app.asar
      - uses: actions/upload-artifact@v4
        with:
          name: binary-geekgeekrun-ui-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            packages/ui/dist/*.exe
            packages/ui/dist/*.dmg
            packages/ui/dist/*.deb
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: binary-geekgeekrun-ui-*
          merge-multiple: true
      - name: Check release version and assets
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          test "$GITHUB_REF_NAME" = "ui-v$version"
          test -f "release-assets/geekgeekrun-pro_${version}_arm64.dmg"
          test -f "release-assets/geekgeekrun-pro_${version}_x64.dmg"
          test -f "release-assets/geekgeekrun-pro_${version}_x64_setup.exe"
          (cd release-assets && sha256sum *.dmg *.exe *.deb > SHA256SUMS.txt)
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          name: GeekGeekRun Pro ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          prerelease: false
          allowUpdates: true
          artifacts: release-assets/*
          bodyFile: docs/releases/0.20.0.md
          token: ${{ secrets.GITHUB_TOKEN }}
