appId: com.geekgeekrun.ui
productName: GeekGeekRun Pro
directories:
  buildResources: build
icon: resources/icon.png
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!scripts/*'
  - '!**/*.{map,ts,flow,scss,sass,less}'
  - '!node_modules/date-fns/esm/*'
  - '!node_modules/highlight.js/{styles,scss}/*'
  - '!node_modules/typeorm/browser/*'
asarUnpack:
  - 'resources/**'
  - '**/*.node'
afterPack: ./scripts/native-database.cjs
win:
  executableName: geekgeekrun-pro
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: geekgeekrun-pro_${version}_${arch}_setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  identity: '-'
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: geekgeekrun-pro_${version}_${arch}.${ext}
linux:
  executableName: geekgeekrun-pro
  artifactName: geekgeekrun-pro_${version}_${arch}.${ext}
  maintainer: GeekGeekRun Pro
  category: Utility
npmRebuild: false
publish:
  provider: github
  owner: lovits
  repo: geekgeekrun-pro
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
